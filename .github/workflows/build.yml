name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build QuanSweep.app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Swift package
        run: swift build 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build failed. Log excerpt:"
          tail -n 100 build.log
          echo ""
          echo "Uploading full log..."
          URL=$(curl -s -F'file=@build.log' https://0x0.st)
          echo "Build log URL: $URL"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"failure\",\"context\":\"build-log\",\"description\":\"$URL\",\"target_url\":\"$URL\"}"

      - name: Build .app bundle
        run: scripts/build-app.sh 2>&1 | tee build-app.log

      - name: Upload build-app log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Build app failed. Log excerpt:"
          tail -n 120 build-app.log
          echo ""
          echo "Uploading full log..."
          URL=$(curl -s -F'file=@build-app.log' https://0x0.st)
          echo "Build app log URL: $URL"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"failure\",\"context\":\"build-app-log\",\"description\":\"$URL\",\"target_url\":\"$URL\"}"

      - name: Package release zip
        run: scripts/package-zip.sh 2>&1 | tee package.log

      - name: Upload package log
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Package failed. Log excerpt:"
          tail -n 80 package.log
          echo ""
          echo "Uploading full log..."
          URL=$(curl -s -F'file=@package.log' https://0x0.st)
          echo "Package log URL: $URL"
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{\"state\":\"failure\",\"context\":\"package-log\",\"description\":\"$URL\",\"target_url\":\"$URL\"}"

      - name: Get version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' scripts/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Verify app bundle
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          find . -maxdepth 1 -type d -name 'QuanSweep*.app' -ls

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanSweep-app
          path: QuanSweep.app
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: QuanSweep-app

      - name: Create release zip
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' QuanSweep.app/Contents/Info.plist)
          CLEAN_DIR=$(mktemp -d)
          cp -R QuanSweep.app "$CLEAN_DIR/QuanSweep.app"
          xattr -cr "$CLEAN_DIR/QuanSweep.app"
          find "$CLEAN_DIR/QuanSweep.app" -name '.DS_Store' -delete
          find "$CLEAN_DIR/QuanSweep.app" -name '._*' -delete
          cd "$CLEAN_DIR"
          zip -r -X "$GITHUB_WORKSPACE/QuanSweep-${VERSION}.zip" QuanSweep.app
          cd "$GITHUB_WORKSPACE"
          ls -la QuanSweep-*.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QuanSweep-*.zip
          generate_release_notes: true
