name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build QuanSweep.app
    runs-on: macos-15
    permissions:
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Swift package
        id: swift_build
        run: |
          swift build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "swift build failed with exit code $STATUS"
            tail -n 80 build.log
          fi
          exit $STATUS

      - name: Report build error
        if: failure() && steps.swift_build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          with open('build.log') as f:
              lines = f.readlines()
          error = ' '.join(lines[-5:])[:120]
          data = json.dumps({
              'state': 'failure',
              'context': 'swift-build-error',
              'description': error
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=data,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json'
              },
              method='POST'
          )
          try:
              resp = urllib.request.urlopen(req)
              print(resp.read().decode())
          except Exception as e:
              print(f"Failed to post status: {e}")
          PY

      - name: Build .app bundle
        run: scripts/build-app.sh

      - name: Get version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' scripts/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Verify app bundle
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          find . -maxdepth 1 -type d -name 'QuanSweep*.app' -ls

      - name: Create artifact zip
        run: |
          zip -r QuanSweep-app.zip QuanSweep.app
          ls -la QuanSweep-app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanSweep-app
          path: QuanSweep-app.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: QuanSweep-app

      - name: Extract artifact
        run: unzip -q QuanSweep-app.zip

      - name: Create release zip
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' QuanSweep.app/Contents/Info.plist)
          CLEAN_DIR=$(mktemp -d)
          cp -R QuanSweep.app "$CLEAN_DIR/QuanSweep.app"
          xattr -cr "$CLEAN_DIR/QuanSweep.app"
          find "$CLEAN_DIR/QuanSweep.app" -name '.DS_Store' -delete
          find "$CLEAN_DIR/QuanSweep.app" -name '._*' -delete
          cd "$CLEAN_DIR"
          zip -r -X "$GITHUB_WORKSPACE/QuanSweep-${VERSION}.zip" QuanSweep.app
          cd "$GITHUB_WORKSPACE"
          rm -f QuanSweep-app.zip
          ls -la QuanSweep-*.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QuanSweep-*.zip
          generate_release_notes: true
